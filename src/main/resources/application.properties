
# Application
server.port=8080
spring.application.name=project

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/transaction_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always

# Gateway
spring.cloud.gateway.routes[0].id=demo-route
spring.cloud.gateway.routes[0].uri=https://httpbin.org
spring.cloud.gateway.routes[0].predicates[0]=Path=/demo/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/demo/(?<segment>.*), /${segment}

logging.level.org.springframework.cloud.gateway=DEBUG
